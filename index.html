<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F6F2EC" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#141316" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Дневник эмоций">
  <meta name="description" content="Дневник эмоций: отметь состояние на палитре или наговори, что случилось, — ассистент поможет увидеть корни реакций.">
  <title>Дневник эмоций</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="view" class="view" aria-live="polite"></main>

  <nav class="tabbar" aria-label="Разделы">
    <button class="tab" data-tab="today"><span class="ti" data-icon="today"></span><span>Сегодня</span></button>
    <button class="tab" data-tab="history"><span class="ti" data-icon="book"></span><span>История</span></button>
    <button class="tab" data-tab="insights"><span class="ti" data-icon="spark"></span><span>Инсайты</span></button>
  </nav>

  <!-- Экран записи момента: содержимое рисует app.js -->
  <section id="talk" class="talk" hidden aria-label="Рассказать"></section>

  <!-- Нижний лист -->
  <div id="sheet-wrap" class="sheet-wrap" hidden>
    <div class="sheet-backdrop" data-action="close-sheet"></div>
    <div class="sheet" role="dialog" aria-modal="true">
      <div class="sheet-grab"></div>
      <div id="sheet" class="sheet-body"></div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="app.js"></script>
</body>
</html>
