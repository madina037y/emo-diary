<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Дневник эмоций">
  <meta name="description" content="Дневник эмоций: зафиксируйте момент голосом или текстом, а ассистент поможет увидеть корни реакций.">
  <title>Дневник эмоций</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="view" class="view" aria-live="polite"></main>

  <nav class="tabbar" aria-label="Разделы">
    <button class="tab" data-tab="state"><span class="ti" data-icon="home"></span><span>Состояние</span></button>
    <button class="tab" data-tab="history"><span class="ti" data-icon="book"></span><span>История</span></button>
    <button class="tab tab-center" data-action="talk" aria-label="Рассказать"><span class="center-btn"><span class="ti" data-icon="mic"></span></span><span>Рассказать</span></button>
    <button class="tab" data-tab="patterns"><span class="ti" data-icon="chart"></span><span>Паттерны</span></button>
    <button class="tab" data-tab="work"><span class="ti" data-icon="leaf"></span><span>Работа</span></button>
  </nav>

  <!-- Экран ассистента -->
  <section id="talk" class="talk" hidden aria-label="Ассистент">
    <header class="talk-head">
      <button class="link-btn" data-action="close-talk">Закрыть</button>
      <div class="talk-title">Рассказать</div>
      <span class="talk-spacer"></span>
    </header>
    <div id="chat" class="chat"></div>
    <div id="talk-actions" class="talk-actions"></div>
    <form id="composer" class="composer">
      <button type="button" id="mic" class="mic-btn" aria-label="Голосовой ввод"><span class="ti" data-icon="mic"></span></button>
      <textarea id="input" rows="1" placeholder="Расскажите, что случилось…" enterkeyhint="send"></textarea>
      <button type="submit" id="send" class="send-btn" aria-label="Отправить"><span class="ti" data-icon="up"></span></button>
    </form>
  </section>

  <!-- Нижний лист -->
  <div id="sheet-wrap" class="sheet-wrap" hidden>
    <div class="sheet-backdrop" data-action="close-sheet"></div>
    <div class="sheet" role="dialog" aria-modal="true">
      <div class="sheet-grab"></div>
      <div id="sheet" class="sheet-body"></div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="app.js"></script>
</body>
</html>
